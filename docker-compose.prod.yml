# Prod overlay: Traefik v3 wildcard TLS + demo (Nuxt) + api routing.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NOT verifiable locally — needs real DNS for *.demo.${DEMO_DOMAIN} and a DNS-01
# provider token. Set these in .env before deploy:
#   DEMO_DOMAIN=vortexia.agency
#   ACME_EMAIL=ops@vortexia.agency
#   CF_DNS_API_TOKEN=...            # Cloudflare token with DNS:Edit (or swap provider below)
# Then point A/AAAA (or CNAME) records: *.demo.${DEMO_DOMAIN} and api.${DEMO_DOMAIN} → this host.
services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme

  # {tenant}.demo.vortexia.agency → Nuxt demo (UI resolves tenant from the subdomain itself).
  demo:
    build: ./web
    environment:
      NUXT_PUBLIC_API_BASE: https://api.${DEMO_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.demo.rule=HostRegexp(`^[a-z0-9-]+\.demo\.${DEMO_DOMAIN}$`)
      - traefik.http.routers.demo.entrypoints=websecure
      - traefik.http.routers.demo.tls.certresolver=le
      - traefik.http.routers.demo.tls.domains[0].main=demo.${DEMO_DOMAIN}
      - traefik.http.routers.demo.tls.domains[0].sans=*.demo.${DEMO_DOMAIN}
      - traefik.http.services.demo.loadbalancer.server.port=3000

  api:
    ports: !reset []  # don't expose 8000 publicly in prod; reach it via Traefik only
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${DEMO_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=8000

volumes:
  acme:
